<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="shortcut icon" type="image/x-icon" href="assets/icon.ico">
  <title>Chat-o-Matic 3000</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Шапка сайта -->
  <header class="site-header">
    <div class="logo-container">
      <!-- Забавный SVG логотип (робот) -->
      <svg viewBox="0 0 100 100" class="logo">
        <defs>
          <linearGradient id="g6" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ff6ec7"/><stop offset="1" stop-color="#c40052"/>
          </linearGradient>
        </defs>
        <rect x="6" y="6" width="88" height="88" rx="26" fill="#140a10"/>
        <path d="M50 20 C32 20 24 34 24 50 V76 L34 68 L42 76 L50 68 L58 76 L66 68 L76 76 V50 C76 34 68 20 50 20Z"
              fill="#1c0d16" stroke="url(#g6)" stroke-width="2.5"/>
        <rect x="36" y="42" width="10" height="12" rx="5" fill="#ff2e88"/>
        <rect x="54" y="42" width="10" height="12" rx="5" fill="#ff2e88"/>
        <path d="M44 62 Q50 66 56 62" fill="none" stroke="#ffb3d9" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M76 26 L82 20 M76 26 L82 32 M76 26 L84 26" stroke="#ff6ec7" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
      <h1>Chat-o-Matic 3000</h1>
    </div>
    <div class="btn-wrapper">
      <button id="settingsBtn" class="settings-btn" type="button" title="Настройки">Настройки</button>
      <button id="logoutBtn" class="hidden">Выйти</button>
    </div>
  </header>

  <!-- Основной контент -->
  <main class="main-content">
    
    <canvas style="position:absolute; width: 0px; height: 0px; inset:0; z-index:-1; pointer-events: none"></canvas>
    
    <!-- Экран входа -->
    <div id="loginScreen" class="screen">
      <div class="login-box">
        <h2>Как тебя зовут, путник?</h2>
        <input type="text" id="nameInput" placeholder="Твое имя..." autocomplete="off">
        <button id="enterBtn">Войти в чат</button>
      </div>
    </div>

    <!-- Экран чата -->
    <div id="chatScreen" class="screen hidden">
      <div class="chat-header">
        <div style="display: flex; flex-direction: column; gap: 4px;">
          <span id="status-indicator">Подключение...</span>
          <span id="friend-status" style="font-size: 0.8rem; font-weight: bold; color: #888;">Проверка статуса...</span>
        </div>
        
      </div>
      
      <div id="messages"></div>
       <div id="replyingBar" class="replying-bar hidden"><span id="replyingText"></span><button id="cancelReplyBtn" type="button" aria-label="Отменить ответ">✕</button></div>
       <div id="editingBar" class="replying-bar editing-bar hidden"><span id="editingText">Редактирование сообщения</span><button id="cancelEditBtn" type="button" aria-label="Отменить редактирование">✕</button></div>
      
      <div class="input-area" style="position: relative;">
        <div id="typing-indicator" style="height: 20px; font-size: 0.8rem; color: var(--accent); padding: 0 20px; font-weight: bold; opacity: 0.8; position: absolute; top: -20px"></div>
        <!-- Скрытый инпут для выбора файла -->
        <input type="file" id="fileInput" accept="image/*" style="display: none;">
        <!-- Кнопка для прикрепления -->
        <button id="attachBtn" title="Прикрепить картинку" style="background: var(--border-color); color: var(--text-main); padding-left: 0;">
          <svg class="icon-sm" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="attach">
            <path d="M10.5 6.5V11C10.5 12.38 9.38 13.5 8 13.5C6.62 13.5 5.5 12.38 5.5 11V5C5.5 3.62 6.62 2.5 8 2.5C9.38 2.5 10.5 3.62 10.5 5V10.5C10.5 11.33 9.83 12 9 12C8.17 12 7.5 11.33 7.5 10.5V6" 
                  stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>

        <div class="textarea-wrapper">
          <textarea id="messageInput" placeholder="Напиши что-нибудь..." rows="1" autocomplete="off"></textarea>
          
          <!-- Кнопка смайлика внутри обертки -->
          <button id="emojiBtn" title="Смайлики">
            <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <path d="M8 14s1.5 2 4 2 4-2 4-2"></path>
              <line x1="9" y1="9" x2="9.01" y2="9"></line>
              <line x1="15" y1="9" x2="15.01" y2="9"></line>
            </svg>
          </button>
        </div>
        <button id="sendBtn">➤</button>
      </div>
    </div>

    <div id="settingsModal" class="modal-overlay hidden">
    <div class="modal-content settings-content">
      <h3>Настройки чата</h3>
      <label for="soundVolume">Громкость звука <span id="soundVolumeValue">60%</span></label>
      <input id="soundVolume" type="range" min="0" max="100" value="60">
      <label for="timeFormat">Формат времени</label>
      <select id="timeFormat"><option value="24">24 часа</option><option value="12">12 часов (AM/PM)</option></select>
      <div class="modal-actions"><button id="closeSettingsBtn" class="btn-primary" type="button">Готово</button></div>
    </div>
  </div>

  <div id="imageModal" class="modal-overlay hidden">
    <div class="modal-content">
      <h3>Отправить это изображение?</h3>
      <div class="preview-container">
        <img id="previewImage" src="" alt="Превью">
      </div>
      <label style="display: flex; align-items: center; justify-content: flex-start; gap: 8px; margin-bottom: 10px; cursor: pointer; font-size: 0.9rem;">
        <input type="checkbox" id="keepQualityCheckbox" style="accent-color: #ff80ab;">
        Отправить без сжатия (оригинал)
      </label>
      <input type="text" id="imageCaptionInput" placeholder="Добавить подпись..." autocomplete="off" style="width: 100%; padding: 10px; margin-bottom: 15px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-main); outline: none;">
      <div class="modal-actions">
        <button id="cancelImageBtn" class="btn-secondary">Отмена</button>
        <button id="confirmImageBtn" class="btn-primary">Отправить</button>
      </div>
    </div>
  </div>

  <div id="imageViewer" class="image-viewer hidden">
    <img id="viewerImage" src="" alt="Просмотр">
  </div>

  </main>

  <!-- Подвал -->
  <footer class="site-footer">
    <p>Сделано с любовью к <span style="color: #ff4081;">P2P</span> (который на самом деле Firebase) © 2026</p>
  </footer>

  <script type="module" src="app.js"></script>
</body>
</html>
